# Host nginx in front of the compose stack (plain HTTP; Certbot adds TLS).
#
# DNS: A records for sakukota.lincie.me, sakukota-img.lincie.me and
# sakukota-s3.lincie.me, all pointing at this server.
#
# Install:
#   sudo cp nginx/sakukota.lincie.me.conf /etc/nginx/sites-available/sakukota.lincie.me
#   sudo ln -s /etc/nginx/sites-available/sakukota.lincie.me /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sakukota.lincie.me -d sakukota-img.lincie.me -d sakukota-s3.lincie.me
#
# No other nginx site (for example "default") may list these three names in a
# server_name, or Certbot and nginx will use that block instead of these.
#
# Matching .env values:
#   CORS_ALLOWED_ORIGIN=https://sakukota.lincie.me
#   COOKIE_SECURE=true
#   TRUSTED_PROXY_HOPS=2
#   STORAGE_PUBLIC_ENDPOINT=https://sakukota-s3.lincie.me
#   STORAGE_PUBLIC_URL=https://sakukota-img.lincie.me
#
# After changing CORS_ALLOWED_ORIGIN, run `podman compose up -d` so the init
# service writes it into the bucket's CORS rule.

# Keep connections to the web container open instead of reconnecting per request.
upstream sakukota_web {
    server 127.0.0.1:8081;
    keepalive 64;
}

# Web app and API (the web container serves the app and proxies /api).
server {
    listen 80;
    listen [::]:80;
    server_name sakukota.lincie.me;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://sakukota_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Public images: Garage's website endpoint, which picks the bucket from the Host
# header (root_domain is .web.localhost in docker/garage/garage.toml).
server {
    listen 80;
    listen [::]:80;
    server_name sakukota-img.lincie.me;

    location / {
        proxy_pass http://127.0.0.1:3902;
        proxy_set_header Host sakukota-images.web.localhost;
    }
}

# S3 API, for browser uploads with presigned PUT URLs. The Host header is part of
# the signature, so it must be passed through unchanged. CORS is answered by
# Garage itself (bucket rule written by the init service), not by nginx.
server {
    listen 80;
    listen [::]:80;
    server_name sakukota-s3.lincie.me;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }
}
