# Host nginx in front of the compose stack (plain HTTP; Certbot adds TLS).
#
# DNS: A records for rantau.lincie.me, rantau-img.lincie.me and
# rantau-s3.lincie.me, all pointing at this server.
#
# Install:
#   sudo cp nginx/rantau.lincie.me.conf /etc/nginx/sites-available/rantau.lincie.me
#   sudo ln -s /etc/nginx/sites-available/rantau.lincie.me /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rantau.lincie.me -d rantau-img.lincie.me -d rantau-s3.lincie.me
#
# No other nginx site (for example "default") may list these three names in a
# server_name, or Certbot and nginx will use that block instead of these.
#
# Matching .env values:
#   CORS_ALLOWED_ORIGIN=https://rantau.lincie.me
#   COOKIE_SECURE=true
#   STORAGE_PUBLIC_ENDPOINT=https://rantau-s3.lincie.me
#   STORAGE_PUBLIC_URL=https://rantau-img.lincie.me
#
# After changing CORS_ALLOWED_ORIGIN, run `podman compose up -d` so the init
# service writes it into the bucket's CORS rule.

# Web app and API (the web container serves the app and proxies /api).
server {
    listen 80;
    listen [::]:80;
    server_name rantau.lincie.me;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Public images: Garage's website endpoint, which picks the bucket from the Host
# header (root_domain is .web.localhost in .docker/garage/garage.toml).
server {
    listen 80;
    listen [::]:80;
    server_name rantau-img.lincie.me;

    location / {
        proxy_pass http://127.0.0.1:3902;
        proxy_set_header Host rantau-images.web.localhost;
    }
}

# S3 API, for browser uploads with presigned PUT URLs. The Host header is part of
# the signature, so it must be passed through unchanged. CORS is answered by
# Garage itself (bucket rule written by the init service), not by nginx.
server {
    listen 80;
    listen [::]:80;
    server_name rantau-s3.lincie.me;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }
}
