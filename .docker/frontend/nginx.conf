server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same-origin API: /api/* is /v1/* on the backend, like the Vite dev proxy.
    location /api/ {
        proxy_pass http://api:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend scopes the refresh cookie to /v1/auth; here the auth
        # routes are at /api/auth.
        proxy_cookie_path /v1/auth /api/auth;
    }

    # API reference (Scalar) and its spec. The spec's paths and "Try it" calls
    # use /v1/..., so that prefix is proxied as is.
    location = /docs {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
