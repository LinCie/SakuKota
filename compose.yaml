services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sakukotago}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sakukotago}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-ab585f3faae621737dbe043edb29dfe69a95d3194d76218cda428e47c2f25338}
    ports:
      - "3900:3900"
      - "3902:3902"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  init:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: init
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sakukotago}?sslmode=disable
      STORAGE_ENDPOINT: http://garage:3900
      # Browsers upload from the web container, not the Vite dev server in .env.
      CORS_ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-8081}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-ab585f3faae621737dbe043edb29dfe69a95d3194d76218cda428e47c2f25338}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      # The Garage CLI reads the node key from here.
      - garage_meta:/var/lib/garage/meta:ro
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: .env
    environment:
      # .env points at localhost for running the API on the host.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sakukotago}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://garage:3900
      # The web container's nginx proxies to api:8080; PORT in .env is for the host.
      PORT: "8080"
      # Scraped by prometheus; not published to the host.
      METRICS_ADDR: ":9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
      OTEL_SERVICE_NAME: sakukota-go
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      - api

  prometheus:
    image: docker.io/prom/prometheus:v3
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: docker.io/grafana/grafana:13.2
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./docker/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

  # Keeps traces in the container, so they are gone when it is removed.
  tempo:
    image: docker.io/grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: docker.io/grafana/loki:3.7.10
    volumes:
      - loki_data:/loki

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  prometheus_data:
  grafana_data:
  loki_data:
