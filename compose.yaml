services:
  postgres:
    build:
      context: ./.docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rantaugo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rantaugo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-ab585f3faae621737dbe043edb29dfe69a95d3194d76218cda428e47c2f25338}
    ports:
      - "3900:3900"
      - "3902:3902"
    volumes:
      - ./.docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  init:
    build:
      context: .
      dockerfile: .docker/backend/Dockerfile
      target: init
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rantaugo}?sslmode=disable
      STORAGE_ENDPOINT: http://garage:3900
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:8081}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-ab585f3faae621737dbe043edb29dfe69a95d3194d76218cda428e47c2f25338}
    volumes:
      - ./.docker/garage/garage.toml:/etc/garage.toml:ro
      # The Garage CLI reads the node key from here.
      - garage_meta:/var/lib/garage/meta:ro
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: .docker/backend/Dockerfile
    env_file: .env
    environment:
      # .env points at localhost for running the API on the host.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rantaugo}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://garage:3900
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: .docker/frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
